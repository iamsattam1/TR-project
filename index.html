function unpack64(s){const binary=atob(s);const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));return new TextDecoder("utf-8").decode(bytes)}
const frames={product:document.getElementById('frameProduct'),technical:document.getElementById('frameTechnical')};
frames.product.srcdoc=unpack64(productPayload);frames.technical.srcdoc=unpack64(technicalPayload);
const tabs={product:document.getElementById('tabProduct'),technical:document.getElementById('tabTechnical')};
function activate(which,writeHash=true){const target=which==='technical'?'technical':'product';for(const key of Object.keys(tabs)){const active=key===target;tabs[key].setAttribute('aria-selected',String(active));tabs[key].tabIndex=active?0:-1;frames[key].classList.toggle('inactive',!active);frames[key].setAttribute('aria-hidden',String(!active))}if(writeHash && location.hash!=='#'+target)history.replaceState(null,'','#'+target)}
function onHash(){activate(location.hash.toLowerCase().includes('technical')?'technical':'product',false)}
tabs.product.addEventListener('click',()=>activate('product'));
tabs.technical.addEventListener('click',()=>activate('technical'));
for(const [key,tab] of Object.entries(tabs))tab.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();const next=key==='product'?'technical':'product';activate(next);tabs[next].focus()}});
window.addEventListener('hashchange',onHash);onHash();
</script></body></html>
